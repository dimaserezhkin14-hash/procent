<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gifts Predictor</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Шапка профиля -->
        <div class="card balance-card">
            <div class="sub-title">Твой баланс:</div>
            <div class="balance-val" id="user-balance">0 PT</div>
            <button class="btn btn-secondary" id="buy-points-btn">➕ Пополнить поинты</button>
        </div>

        <!-- Секция ставок -->
        <div class="section-title">🔥 Категории дня</div>
        <div class="sub-info">🔒 % ставок и банк скрыты до закрытия раунда!</div>

        <div id="categories-container">
            <!-- Категории будут генерироваться динамически -->
            <div class="card category-card">
                <div class="cat-title">1. Вырастет гифт "Pepe" (>20%)</div>
                <input type="number" class="bet-input" placeholder="Введите сумму PT" id="bet-1">
                <button class="btn btn-primary" onclick="submitBet(1)">Сделать ставку</button>
            </div>

            <div class="card category-card">
                <div class="cat-title">2. Полный скуп гифтов "Sparks"</div>
                <input type="number" class="bet-input" placeholder="Введите сумму PT" id="bet-2">
                <button class="btn btn-primary" onclick="submitBet(2)">Сделать ставку</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
